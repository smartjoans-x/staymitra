<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="refresh" content="60">

<title>StayMitra — Coming Soon</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    background:#020817;
    color:#fff;
}

/* =========================================
   BACKGROUND
========================================= */

.page{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(0,170,255,.12),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 20%,
            rgba(100,80,255,.14),
            transparent 25%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(0,220,200,.08),
            transparent 25%
        ),
        #020817;
}

/* =========================================
   CANVAS
========================================= */

#particles{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
}

/* =========================================
   GRID
========================================= */

.grid{
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:70px 70px;

    mask-image:
        radial-gradient(
            ellipse at center,
            black 20%,
            transparent 80%
        );

    z-index:0;

    animation:gridMove 20s linear infinite;
}

@keyframes gridMove{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(70px);
    }
}

/* =========================================
   GLOW ORBS
========================================= */

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(100px);
    pointer-events:none;
    z-index:0;
}

.orb.one{
    width:420px;
    height:420px;
    background:#0077ff;
    opacity:.14;
    left:-180px;
    top:-150px;

    animation:
        orbOne 12s ease-in-out infinite alternate;
}

.orb.two{
    width:450px;
    height:450px;
    background:#6d28d9;
    opacity:.13;
    right:-180px;
    bottom:-180px;

    animation:
        orbTwo 15s ease-in-out infinite alternate;
}

@keyframes orbOne{

    to{
        transform:
            translate(150px,100px)
            scale(1.2);
    }
}

@keyframes orbTwo{

    to{
        transform:
            translate(-120px,-100px)
            scale(1.25);
    }
}

/* =========================================
   TOP NAV
========================================= */

.topbar{

    position:absolute;

    top:0;
    left:0;

    width:100%;

    padding:
        28px 6%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    z-index:10;
}

.brand{

    display:flex;

    align-items:center;

    gap:12px;

    font-size:18px;

    font-weight:700;

    letter-spacing:.5px;
}

.brand-icon{

    width:42px;
    height:42px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #00c6ff,
            #635bff
        );

    box-shadow:
        0 8px 30px
        rgba(0,180,255,.3);

    font-size:20px;

    animation:
        brandFloat 3s ease-in-out infinite;
}

@keyframes brandFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-4px);
    }
}

.status{

    display:flex;

    align-items:center;

    gap:8px;

    padding:
        8px 14px;

    border-radius:30px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.08);

    font-size:11px;

    color:
        rgba(255,255,255,.6);

    letter-spacing:1px;

    text-transform:uppercase;
}

.status-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#00e5a0;

    box-shadow:
        0 0 12px
        #00e5a0;

    animation:
        statusPulse 1.5s infinite;
}

@keyframes statusPulse{

    50%{
        opacity:.35;
        transform:scale(.7);
    }
}

/* =========================================
   CENTER
========================================= */

.center{

    position:relative;

    z-index:5;

    width:100%;
    height:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:100px 20px 80px;
}

.content{

    width:min(900px,100%);

    animation:
        pageIn 1.3s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes pageIn{

    from{
        opacity:0;
        transform:
            translateY(50px)
            scale(.96);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

/* =========================================
   MINI LABEL
========================================= */

.eyebrow{

    display:inline-flex;

    align-items:center;

    gap:9px;

    padding:
        9px 16px;

    border-radius:50px;

    background:
        rgba(0,180,255,.06);

    border:
        1px solid
        rgba(0,200,255,.18);

    color:#80dcff;

    font-size:11px;

    font-weight:600;

    letter-spacing:3px;

    text-transform:uppercase;

    margin-bottom:28px;

    animation:
        fadeUp .8s .2s both;
}

.eyebrow-line{

    width:20px;
    height:1px;

    background:
        #55d9ff;
}

/* =========================================
   MAIN TITLE
========================================= */

.title{

    font-size:
        clamp(
            64px,
            12vw,
            145px
        );

    line-height:.82;

    letter-spacing:
        -7px;

    font-weight:850;

    margin-left:-7px;

    color:#fff;

    animation:
        titleIn 1s .35s both;
}

@keyframes titleIn{

    from{
        opacity:0;
        letter-spacing:20px;
        filter:blur(10px);
    }

    to{
        opacity:1;
        letter-spacing:-7px;
        filter:blur(0);
    }
}

.title span{

    background:
        linear-gradient(
            100deg,
            #fff 0%,
            #a9eaff 35%,
            #6588ff 65%,
            #fff 100%
        );

    background-size:250% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        titleGradient 5s linear infinite;
}

@keyframes titleGradient{

    to{
        background-position:
            250% center;
    }
}

/* =========================================
   SUBTITLE
========================================= */

.subtitle{

    margin-top:30px;

    font-size:
        clamp(
            16px,
            2vw,
            21px
        );

    line-height:1.7;

    color:
        rgba(255,255,255,.52);

    max-width:620px;

    margin-left:auto;
    margin-right:auto;

    animation:
        fadeUp .9s .7s both;
}

.subtitle strong{

    color:
        rgba(255,255,255,.85);

    font-weight:500;
}

/* =========================================
   COMING SOON
========================================= */

.coming{

    position:relative;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    margin-top:38px;

    padding:
        17px 34px;

    border-radius:100px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.16);

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.25),
        inset 0 1px 0
        rgba(255,255,255,.08);

    overflow:hidden;

    animation:
        fadeUp .9s .9s both,
        comingPulse 3s
        1.8s ease-in-out infinite;
}

.coming::before{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            110deg,
            transparent 20%,
            rgba(255,255,255,.12),
            transparent 80%
        );

    transform:
        translateX(-120%);

    animation:
        shine 3.5s infinite;
}

@keyframes shine{

    0%,30%{
        transform:
            translateX(-120%);
    }

    70%,100%{
        transform:
            translateX(120%);
    }
}

@keyframes comingPulse{

    0%,100%{
        box-shadow:
            0 15px 50px
            rgba(0,0,0,.25),
            0 0 0
            rgba(0,190,255,0);
    }

    50%{
        box-shadow:
            0 15px 55px
            rgba(0,0,0,.3),
            0 0 35px
            rgba(0,180,255,.12);
    }
}

.coming-dot{

    width:8px;
    height:8px;

    border-radius:50%;

    background:#00d9ff;

    box-shadow:
        0 0 14px
        #00d9ff;

    margin-right:13px;

    animation:
        dotPulse 1.3s infinite;
}

@keyframes dotPulse{

    50%{
        opacity:.3;
        transform:scale(.55);
    }
}

.coming-text{

    position:relative;

    z-index:2;

    font-size:13px;

    font-weight:700;

    letter-spacing:5px;

    color:#fff;
}

/* =========================================
   FEATURE STRIP
========================================= */

.features{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:0;

    margin-top:52px;

    animation:
        fadeUp 1s 1.1s both;
}

.feature{

    min-width:150px;

    padding:
        0 28px;

    border-right:
        1px solid
        rgba(255,255,255,.09);
}

.feature:last-child{
    border-right:none;
}

.feature-icon{

    font-size:20px;

    margin-bottom:8px;

    opacity:.8;
}

.feature-text{

    font-size:10px;

    text-transform:uppercase;

    letter-spacing:2px;

    color:
        rgba(255,255,255,.4);
}

/* =========================================
   BOTTOM
========================================= */

.bottom{

    position:absolute;

    bottom:27px;

    left:0;

    width:100%;

    z-index:10;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:10px;
}

.bottom-text{

    font-size:10px;

    letter-spacing:2px;

    color:
        rgba(255,255,255,.28);

    text-transform:uppercase;
}

.progress{

    width:180px;

    height:2px;

    background:
        rgba(255,255,255,.08);

    border-radius:10px;

    overflow:hidden;
}

.progress span{

    display:block;

    height:100%;

    width:35%;

    background:
        linear-gradient(
            90deg,
            #00cfff,
            #7565ff
        );

    border-radius:10px;

    animation:
        progressMove 2.5s
        ease-in-out infinite alternate;
}

@keyframes progressMove{

    from{
        transform:translateX(-10px);
        width:20%;
    }

    to{
        transform:translateX(120px);
        width:45%;
    }
}

/* =========================================
   ORBIT
========================================= */

.orbit{

    position:absolute;

    width:520px;
    height:520px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border:
        1px solid
        rgba(100,190,255,.055);

    border-radius:50%;

    z-index:2;

    pointer-events:none;

    animation:
        orbitRotate 35s
        linear infinite;
}

.orbit::before{

    content:"";

    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:#53dfff;

    box-shadow:
        0 0 20px
        #53dfff;

    top:0;
    left:50%;

    transform:translateX(-50%);
}

.orbit::after{

    content:"";

    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#9b7cff;

    bottom:14%;
    right:4%;

    box-shadow:
        0 0 15px
        #9b7cff;
}

@keyframes orbitRotate{

    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }
}

/* =========================================
   FADE
========================================= */

@keyframes fadeUp{

    from{
        opacity:0;
        transform:
            translateY(25px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .topbar{
        padding:20px;
    }

    .brand{
        font-size:15px;
    }

    .brand-icon{
        width:36px;
        height:36px;
        font-size:17px;
    }

    .status{
        font-size:9px;
        padding:7px 10px;
    }

    .center{
        padding:
            100px 18px 80px;
    }

    .eyebrow{
        font-size:9px;
        letter-spacing:2px;
    }

    .title{
        font-size:
            clamp(
                58px,
                19vw,
                95px
            );

        letter-spacing:-4px;

        margin-left:-4px;
    }

    @keyframes titleIn{

        from{
            opacity:0;
            letter-spacing:12px;
            filter:blur(10px);
        }

        to{
            opacity:1;
            letter-spacing:-4px;
            filter:blur(0);
        }
    }

    .subtitle{
        font-size:14px;
        margin-top:25px;
    }

    .coming{
        margin-top:30px;
        padding:14px 24px;
    }

    .coming-text{
        font-size:11px;
        letter-spacing:3px;
    }

    .features{
        margin-top:38px;
    }

    .feature{
        min-width:auto;
        padding:0 15px;
    }

    .feature-icon{
        font-size:16px;
    }

    .feature-text{
        font-size:8px;
        letter-spacing:1px;
    }

    .orbit{
        width:330px;
        height:330px;
    }

    .bottom{
        bottom:18px;
    }
}

/* =========================================
   SMALL SCREEN
========================================= */

@media(max-height:650px){

    .features{
        margin-top:25px;
    }

    .subtitle{
        margin-top:18px;
    }

    .coming{
        margin-top:20px;
    }

    .eyebrow{
        margin-bottom:18px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- Background -->
    <div class="grid"></div>

    <div class="orb one"></div>
    <div class="orb two"></div>

    <canvas id="particles"></canvas>

    <!-- Orbit -->
    <div class="orbit"></div>


    <!-- TOP BAR -->
    <header class="topbar">

        <div class="brand">

            <div class="brand-icon">
                🏨
            </div>

            <span>StayMitra</span>

        </div>


        <div class="status">

            <span class="status-dot"></span>

            Preparing Something Special

        </div>

    </header>


    <!-- CENTER -->
    <main class="center">

        <div class="content">

            <div class="eyebrow">

                <span class="eyebrow-line"></span>

                A New Stay Experience

                <span class="eyebrow-line"></span>

            </div>


            <h1 class="title">

                <span>StayMitra</span>

            </h1>


            <p class="subtitle">

                A better way to
                <strong>stay, relax and feel at home.</strong>
                <br>

                We're getting everything ready for you.

            </p>


            <div class="coming">

                <span class="coming-dot"></span>

                <span class="coming-text">
                    COMING SOON
                </span>

            </div>


            <div class="features">

                <div class="feature">

                    <div class="feature-icon">
                        🏠
                    </div>

                    <div class="feature-text">
                        Comfortable
                    </div>

                </div>


                <div class="feature">

                    <div class="feature-icon">
                        ✦
                    </div>

                    <div class="feature-text">
                        Trusted
                    </div>

                </div>


                <div class="feature">

                    <div class="feature-icon">
                        ♡
                    </div>

                    <div class="feature-text">
                        Stay Better
                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- BOTTOM -->
    <div class="bottom">

        <div class="progress">
            <span></span>
        </div>

        <div class="bottom-text">
            Stay Comfortable · Stay Connected
        </div>

    </div>

</div>


<script>

/* =========================================
   PARTICLE ENGINE
========================================= */

const canvas =
    document.getElementById("particles");

const ctx =
    canvas.getContext("2d");

let particles = [];

let mouse = {
    x:null,
    y:null
};


function resize(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resize();

window.addEventListener(
    "resize",
    resize
);


window.addEventListener(
    "mousemove",
    e => {

        mouse.x = e.clientX;
        mouse.y = e.clientY;

    }
);


window.addEventListener(
    "mouseleave",
    () => {

        mouse.x = null;
        mouse.y = null;

    }
);


/* =========================================
   PARTICLE
========================================= */

class Particle{

    constructor(){

        this.x =
            Math.random() *
            canvas.width;

        this.y =
            Math.random() *
            canvas.height;

        this.size =
            Math.random() * 1.8 + .3;

        this.speedX =
            (Math.random()-.5)
            * .35;

        this.speedY =
            (Math.random()-.5)
            * .35;

        this.alpha =
            Math.random() * .6 + .1;

    }


    update(){

        this.x += this.speedX;

        this.y += this.speedY;


        if(
            this.x < -20 ||
            this.x > canvas.width + 20
        ){

            this.speedX *= -1;

        }


        if(
            this.y < -20 ||
            this.y > canvas.height + 20
        ){

            this.speedY *= -1;

        }


        /* Mouse interaction */

        if(
            mouse.x !== null &&
            mouse.y !== null
        ){

            const dx =
                this.x - mouse.x;

            const dy =
                this.y - mouse.y;

            const distance =
                Math.sqrt(
                    dx*dx +
                    dy*dy
                );


            if(distance < 120){

                const force =
                    (120-distance)/120;

                this.x +=
                    (dx/distance)
                    * force
                    * .5;

                this.y +=
                    (dy/distance)
                    * force
                    * .5;

            }
        }

    }


    draw(){

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            `rgba(
                120,
                210,
                255,
                ${this.alpha}
            )`;

        ctx.fill();

    }

}


/* =========================================
   CREATE
========================================= */

const particleCount =
    window.innerWidth < 600
    ? 75
    : 145;


for(
    let i=0;
    i<particleCount;
    i++
){

    particles.push(
        new Particle()
    );

}


/* =========================================
   CONNECT
========================================= */

function connect(){

    for(
        let i=0;
        i<particles.length;
        i++
    ){

        for(
            let j=i+1;
            j<particles.length;
            j++
        ){

            const dx =
                particles[i].x -
                particles[j].x;

            const dy =
                particles[i].y -
                particles[j].y;

            const distance =
                Math.sqrt(
                    dx*dx +
                    dy*dy
                );


            if(distance < 100){

                const opacity =
                    (1-distance/100)
                    * .12;


                ctx.beginPath();

                ctx.moveTo(
                    particles[i].x,
                    particles[i].y
                );

                ctx.lineTo(
                    particles[j].x,
                    particles[j].y
                );

                ctx.strokeStyle =
                    `rgba(
                        80,
                        190,
                        255,
                        ${opacity}
                    )`;

                ctx.lineWidth=.5;

                ctx.stroke();

            }

        }

    }

}


/* =========================================
   ANIMATION
========================================= */

function animate(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    particles.forEach(
        p => {

            p.update();
            p.draw();

        }
    );


    connect();


    requestAnimationFrame(
        animate
    );

}

animate();


/* =========================================
   RANDOM STARS
========================================= */

function createStars(){

    const count =
        window.innerWidth < 600
        ? 20
        : 35;


    for(
        let i=0;
        i<count;
        i++
    ){

        const star =
            document.createElement("div");


        star.style.position =
            "absolute";

        star.style.width =
            Math.random()*3+1+"px";

        star.style.height =
            star.style.width;

        star.style.borderRadius =
            "50%";

        star.style.background =
            "rgba(255,255,255,.6)";

        star.style.left =
            Math.random()*100+"%";

        star.style.top =
            Math.random()*100+"%";

        star.style.zIndex =
            "2";

        star.style.pointerEvents =
            "none";

        star.style.animation =
            `twinkle ${
                Math.random()*4+2
            }s infinite alternate`;

        document
            .querySelector(".page")
            .appendChild(star);

    }

}


const style =
document.createElement("style");

style.innerHTML = `

@keyframes twinkle{

    from{
        opacity:.1;
        transform:scale(.5);
    }

    to{
        opacity:.8;
        transform:scale(1.4);
    }

}`;

document.head.appendChild(style);

createStars();

</script>

</body>
</html>
