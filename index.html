<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Refresh every 60 seconds -->
<meta http-equiv="refresh" content="60">

<title>StayMitra - Coming Soon</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    background:
        radial-gradient(circle at 20% 20%, rgba(0, 220, 255, 0.18), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(120, 70, 255, 0.20), transparent 35%),
        linear-gradient(135deg, #07111f, #0b1730 45%, #10132b);

    color: white;
}

/* =========================
   PARTICLE CANVAS
========================= */

#particles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

/* =========================
   BACKGROUND GLOW
========================= */

.glow {
    position: fixed;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .35;
    z-index: 0;

    animation: glowMove 10s infinite alternate ease-in-out;
}

.glow.one {
    background: #00d9ff;
    top: -120px;
    left: -100px;
}

.glow.two {
    background: #7c3aed;
    right: -120px;
    bottom: -120px;
    animation-delay: 2s;
}

@keyframes glowMove {

    from {
        transform: translate(0, 0) scale(1);
    }

    to {
        transform: translate(80px, 50px) scale(1.2);
    }
}

/* =========================
   MAIN CONTAINER
========================= */

.container {
    position: relative;
    z-index: 5;

    width: 100%;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
    padding: 20px;
}

/* =========================
   GLASS CARD
========================= */

.welcome-card {

    width: min(90%, 720px);

    padding: 55px 35px;

    border-radius: 30px;

    background: rgba(255,255,255,0.07);

    border: 1px solid rgba(255,255,255,0.15);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 25px 80px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.12);

    animation:
        cardIn 1.4s cubic-bezier(.17,.67,.3,1.3);
}

@keyframes cardIn {

    0% {
        opacity: 0;
        transform: translateY(70px) scale(.85);
    }

    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* =========================
   HOTEL ICON
========================= */

.hotel-icon {

    width: 85px;
    height: 85px;

    margin: 0 auto 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 25px;

    background:
        linear-gradient(
            135deg,
            #00d9ff,
            #635bff
        );

    box-shadow:
        0 15px 40px rgba(0,217,255,.25);

    animation:
        floating 3s ease-in-out infinite;
}

.hotel-icon span {
    font-size: 42px;
}

@keyframes floating {

    0%,100% {
        transform: translateY(0) rotate(0deg);
    }

    50% {
        transform: translateY(-12px) rotate(2deg);
    }
}

/* =========================
   WELCOME TEXT
========================= */

.welcome {

    font-size: 18px;

    letter-spacing: 4px;

    text-transform: uppercase;

    color: #a9dfff;

    margin-bottom: 12px;

    animation:
        fadeUp 1s .4s both;
}

/* =========================
   STAYMITRA
========================= */

h1 {

    font-size: clamp(48px, 9vw, 88px);

    font-weight: 800;

    line-height: 1;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #8be9ff,
            #9c8cff,
            #ffffff
        );

    background-size: 300% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        fadeUp 1s .6s both,
        gradientMove 5s linear infinite;
}

@keyframes gradientMove {

    to {
        background-position:
            300% center;
    }
}

/* =========================
   TAGLINE
========================= */

.tagline {

    margin-top: 20px;

    font-size: 18px;

    color:
        rgba(255,255,255,.72);

    animation:
        fadeUp 1s .8s both;
}

/* =========================
   COMING SOON
========================= */

.coming-soon {

    position: relative;

    display: inline-block;

    margin-top: 38px;

    padding: 14px 30px;

    border-radius: 50px;

    font-size: 18px;

    font-weight: 800;

    letter-spacing: 4px;

    color: #ffffff;

    background:
        linear-gradient(
            90deg,
            #00cfff,
            #635bff,
            #00cfff
        );

    background-size: 250% 100%;

    box-shadow:
        0 10px 35px rgba(0,180,255,.25);

    animation:
        comingGradient 3s linear infinite,
        comingPulse 2s ease-in-out infinite,
        fadeUp 1s 1s both;

    overflow: hidden;
}

/* Moving shine */

.coming-soon::before {

    content: "";

    position: absolute;

    top: 0;
    left: -120%;

    width: 80%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.6),
            transparent
        );

    transform: skewX(-20deg);

    animation:
        shine 2.5s infinite;
}

@keyframes shine {

    0% {
        left: -120%;
    }

    50% {
        left: 130%;
    }

    100% {
        left: 130%;
    }
}

@keyframes comingGradient {

    0% {
        background-position: 0% center;
    }

    100% {
        background-position: 250% center;
    }
}

@keyframes comingPulse {

    0%,
    100% {
        transform: scale(1);
        box-shadow:
            0 10px 35px rgba(0,180,255,.25);
    }

    50% {
        transform: scale(1.06);
        box-shadow:
            0 15px 50px rgba(0,200,255,.45);
    }
}

/* =========================
   BOTTOM TEXT
========================= */

.bottom-text {

    position: fixed;

    bottom: 22px;

    left: 0;

    width: 100%;

    text-align: center;

    font-size: 12px;

    color:
        rgba(255,255,255,.4);

    z-index: 5;
}

/* =========================
   FLOATING DOTS
========================= */

.dot {

    position: fixed;

    border-radius: 50%;

    background:
        rgba(255,255,255,.5);

    pointer-events: none;

    z-index: 2;

    animation:
        floatDot linear infinite;
}

@keyframes floatDot {

    from {
        transform:
            translateY(100vh);
        opacity: 0;
    }

    20% {
        opacity: .8;
    }

    80% {
        opacity: .8;
    }

    to {
        transform:
            translateY(-20vh);
        opacity: 0;
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    .welcome-card {

        padding: 45px 22px;

        border-radius: 25px;
    }

    .hotel-icon {

        width: 70px;
        height: 70px;

        border-radius: 20px;
    }

    .hotel-icon span {
        font-size: 34px;
    }

    .welcome {

        font-size: 14px;

        letter-spacing: 3px;
    }

    .tagline {

        font-size: 15px;

        line-height: 1.6;
    }

    .coming-soon {

        font-size: 15px;

        letter-spacing: 3px;

        padding: 13px 25px;
    }
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<canvas id="particles"></canvas>

<div id="floatingDots"></div>

<div class="container">

    <div class="welcome-card">

        <div class="hotel-icon">
            <span>🏨</span>
        </div>

        <div class="welcome">
            Welcome to
        </div>

        <h1>StayMitra</h1>

        <div class="tagline">
            Your comfortable stay, your trusted companion.
        </div>

        <div class="coming-soon">
            COMING SOON
        </div>

    </div>

</div>

<div class="bottom-text">
    © 2026 StayMitra · Stay Comfortable. Stay Connected.
</div>


<script>

/* =====================================
   PARTICLE SYSTEM
===================================== */

const canvas =
    document.getElementById("particles");

const ctx =
    canvas.getContext("2d");

let particles = [];


function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* Particle */

class Particle {

    constructor() {

        this.x =
            Math.random() *
            canvas.width;

        this.y =
            Math.random() *
            canvas.height;

        this.size =
            Math.random() * 2.2 + .5;

        this.speedX =
            (Math.random() - .5) * .45;

        this.speedY =
            (Math.random() - .5) * .45;

        this.opacity =
            Math.random() * .6 + .2;
    }


    update() {

        this.x += this.speedX;

        this.y += this.speedY;


        if (
            this.x < 0 ||
            this.x > canvas.width
        ) {

            this.speedX *= -1;
        }


        if (
            this.y < 0 ||
            this.y > canvas.height
        ) {

            this.speedY *= -1;
        }
    }


    draw() {

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(
                160,
                220,
                255,
                ${this.opacity}
            )`;

        ctx.fill();
    }
}


/* Create particles */

for (
    let i = 0;
    i < 120;
    i++
) {

    particles.push(
        new Particle()
    );
}


/* Connect particles */

function connectParticles() {

    for (
        let a = 0;
        a < particles.length;
        a++
    ) {

        for (
            let b = a + 1;
            b < particles.length;
            b++
        ) {

            const dx =
                particles[a].x -
                particles[b].x;

            const dy =
                particles[a].y -
                particles[b].y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (distance < 120) {

                const opacity =
                    (1 - distance / 120)
                    * .15;


                ctx.beginPath();

                ctx.moveTo(
                    particles[a].x,
                    particles[a].y
                );

                ctx.lineTo(
                    particles[b].x,
                    particles[b].y
                );

                ctx.strokeStyle =
                    `rgba(
                        130,
                        210,
                        255,
                        ${opacity}
                    )`;

                ctx.lineWidth = .6;

                ctx.stroke();
            }
        }
    }
}


/* Animation */

function animate() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    particles.forEach(
        particle => {

            particle.update();
            particle.draw();

        }
    );


    connectParticles();


    requestAnimationFrame(
        animate
    );
}

animate();


/* =====================================
   FLOATING DOTS
===================================== */

const dotsContainer =
    document.getElementById(
        "floatingDots"
    );


for (
    let i = 0;
    i < 25;
    i++
) {

    const dot =
        document.createElement("div");

    dot.className = "dot";


    const size =
        Math.random() * 5 + 2;


    dot.style.width =
        size + "px";

    dot.style.height =
        size + "px";


    dot.style.left =
        Math.random() * 100 + "%";


    dot.style.animationDuration =
        (Math.random() * 12 + 8)
        + "s";


    dot.style.animationDelay =
        Math.random() * 10 + "s";


    dotsContainer.appendChild(dot);
}

</script>

</body>
</html>
